<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ff5000">
    <title>Offline · BW Superbakeshop</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; text-align: center; color: #1f1f1f; padding: 24px; }
        img { width: 96px; height: 96px; }
        h1 { font-size: 1.25rem; margin: 16px 0 8px; }
        p { color: #666; margin: 0 0 20px; }
        button { background: #ff5000; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 1rem; font-weight: 600; }
        #queued { display: none; margin: 0 auto 20px; max-width: 360px; background: #fff6e5; border: 1px solid #f0c58a; color: #7a4a00; border-radius: 10px; padding: 12px 16px; font-size: .9rem; text-align: left; }
        #status { font-size: .85rem; margin-top: 16px; }
    </style>
</head>
<body>
    <main>
        <img src="/images/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Connect to the internet to place or view orders.</p>
        <div id="queued" role="status"></div>
        <button onclick="location.reload()">Try again</button>
        <p id="status">We'll reload this page by itself when the connection is back.</p>
    </main>
    <script>
        // an order placed without a connection is kept on this device; say so, because it is not sent yet
        try {
            var waiting = 0;
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf('bw-queued-order-') === 0) {
                    var q = JSON.parse(localStorage.getItem(k));
                    if (q && !q.rejected) waiting++;
                }
            }
            if (waiting > 0) {
                var box = document.getElementById('queued');
                box.textContent = 'An order is saved on this device and NOT sent yet. It will be placed automatically once you are back online and the app is open.';
                box.style.display = 'block';
            }
        } catch (e) {}
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
